<style>
/* Layout: header, how-to-decide, summary, open questions, heat map, then one section per view: screenshot with pins left, finding cards right. */
:root {

  --accent: #7fa8f0; --accent-fg: #0c1420;
  --p0: #ff5d78; --p1: #ff8a45; --p2: #e9c03a; --p3: #8fa3b8;
  --s0: #a8304a; --s1: #b5603a; --s2: #a88a33; --s3: #5f8a52; --s4: #2f7d55;

:root[data-theme="dark"] {

.pair figure { margin: 0; display: grid; gap: 4px; min-width: 0; }

.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 10px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; justify-content: space-between; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.controls label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.controls select { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 220px; }

.views { display: grid; gap: 64px; }
.view { display: grid; gap: 12px; scroll-margin-top: 70px; }
.view-title { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.view-title h2 { font-size: 22px; }
.view-title .muted { font-size: 14px; }
.view-sum { margin: 0; color: var(--muted); max-width: 80ch; }
.view-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }

.job { margin: 0; font-size: 14px; }
.mini { font-size: 14px; }

.mini[open] > summary { margin-bottom: 8px; }
.about { color: var(--muted); }
.about[open] { display: grid; gap: 8px; }
.about ol { margin: 4px 0 0; padding-left: 20px; }
.strengths { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
.board { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.board.narrow { grid-template-columns: minmax(0, 420px) minmax(0, 1fr); }
.board.noshot { grid-template-columns: minmax(0, 1fr); }
@media (max-width: 900px) { .board, .board.narrow { grid-template-columns: minmax(0, 1fr); } }
.shot { position: sticky; top: 64px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); max-height: calc(100vh - 80px); overflow-y: auto; }
@media (max-width: 900px) { .shot { position: static; max-height: 75vh; } }
@media (max-width: 600px) { .controls { position: static; } }
.shot-inner { position: relative; }
.shot img { display: block; width: 100%; height: auto; }
.box { position: absolute; border: 2px solid var(--p); border-radius: 4px; background: color-mix(in srgb, var(--p) 10%, transparent); pointer-events: none; opacity: 0; transition: opacity .15s; }

.pin { position: absolute; transform: translate(-40%, -40%); width: 24px; height: 24px; border-radius: 50%; background: var(--p); color: #fff; font: 700 12px/24px var(--mono); text-align: center; border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); cursor: pointer; padding: 0; }
.pin.hl { transform: translate(-40%, -40%) scale(1.25); }
.cards { display: grid; gap: 16px; min-width: 0; }
.card, .qcard { scroll-margin-top: 90px; }
.card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--p); border-radius: 12px; padding: 20px; display: grid; gap: 16px; min-width: 0; }
.card.hl { box-shadow: 0 0 0 2px var(--p); }
.card-top { display: flex; gap: 10px; align-items: flex-start; }
.card-top .n { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--p); color: #fff; font: 700 12px/26px var(--mono); text-align: center; margin-top: 1px; }
.card-top .n.page { border-radius: 5px; }
.card-title { flex: 1; min-width: 0; display: grid; gap: 6px; }

.seg button:disabled { cursor: default; opacity: .55; }
.seg-note { font-size: 12px; color: var(--muted); }
.decide textarea, .qcard textarea { width: 100%; min-height: 34px; resize: vertical; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
.decide-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.foot-actions { display: inline-flex; flex-wrap: wrap; gap: 14px; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; text-decoration: underline; }
.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }

table.drift { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 720px; }
.drift th, .drift td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }

.drift td:first-child { font: 500 12px var(--mono); white-space: nowrap; }

<div class="wrap">

        const n = i + 1, p = sevVar(f.severity);
        const at = inner ? (f.viewport ? (f.viewport === vp ? f.pin : null) : f.pins?.[vp]) : null;
        const pinned = !!at;
        let box = null, pin = null;
        const card = findingCard(f, n, p, pinned);
        if (pinned) {
          box = el('div', { class: 'box', style: `--p:${p};left:${at.x}%;top:${at.y}%;width:${at.w}%;height:${at.h}%` });
          pin = el('button', { class: 'pin', style: `--p:${p};left:${at.x}%;top:${at.y}%`, 'aria-label': `${n}: ${f.title}`, text: String(n), onclick: () => card.scrollIntoView({ behavior: 'smooth', block: 'center' }) });
          inner.append(box, pin);
        }
        const on = x => () => [box, pin, card].forEach(e => e?.classList.toggle('hl', x));
        for (const e of [pin, card]) if (e) { e.addEventListener('mouseenter', on(true)); e.addEventListener('mouseleave', on(false)); e.addEventListener('focusin', on(true)); e.addEventListener('focusout', on(false)); }
        cards.append(card);
      });
      if (!list.length) cards.append(el('p', { class: 'empty', text: all.length ? T.noMatch : T.none }));
      sec.append(el('div', { class: 'board' + (!inner ? ' noshot' : vp === 'desktop' ? '' : ' narrow') }, inner ? el('div', { class: 'shot' }, inner) : null, cards));
      root.append(sec);
    }
  }

  function findingCard(f, n, p, pinned) {
    const card = el('article', { class: 'card', style: `--p:${p}`, id: 'f-' + f.id });
    // Reading order: what it is, the problem, the fix, the evidence, then the decision. Metadata last.
    card.append(el('header', { class: 'card-top' },
      el('span', { class: 'n' + (pinned ? '' : ' page'), title: pinned ? '' : T.wholeView, text: pinned ? String(n) : '▣' }),
      el('div', { class: 'card-title' },
        el('h3', { text: f.title }),
        el('div', { class: 'flags' }, el('span', { class: 'tag sev', text: `${f.severity} ${T.sevName[f.severity]}` }),
          f.theme ? el('span', { class: 'theme', text: f.theme }) : null,
          f.history ? el('span', { class: 'tag hist', text: T[f.history] }) : null,
          f.verification ? el('span', { class: 'tag hist', text: T.verification[f.verification] }) : null,
          f.newFeature ? el('span', { class: 'tag warn', text: T.newFeature }) : null,
          f.brand ? el('span', { class: 'tag warn', text: T.brand }) : null))));
    card.append(el('section', { class: 'part' }, el('h4', { class: 'lbl', text: T.why }), el('p', { text: f.why })));
    card.append(el('section', { class: 'part fix' }, el('h4', { class: 'lbl', text: T.fixL }), el('p', { text: f.fix })));
    if (f.appliesTo?.length) card.append(el('div', { class: 'applies' }, T.appliesTo, f.appliesTo.map(id => el('a', { href: '#' + anchor(id), class: 'tag', text: viewById(id) ? viewTitle(viewById(id)) : id }))));
    if (f.before) card.append(el('div', { class: 'pair' },
      el('figure', {}, el('figcaption', { text: T.before }), el('img', { src: f.before, alt: `${T.before}: ${f.title}`, loading: 'lazy' })),
      f.after ? el('figure', {}, el('figcaption', { text: T.now }), el('img', { src: f.after, alt: `${T.now}: ${f.title}`, loading: 'lazy' })) : null));
    if (f.question && questionById(f.question)) card.append(el('p', { class: 'qlink' }, `${T.decidedIn}: `, el('a', { href: '#q-' + f.question, text: questionById(f.question).question })));
    const extras = [
      f.mockup?.after ? mockupFold(`${T.showMockup} · ${T.after}`, f.mockup.after) : null,
      f.mockup?.before ? mockupFold(`${T.showMockup} · ${T.before}`, f.mockup.before) : null,
      f.rule ? el('details', { class: 'mini' }, el('summary', { text: `${T.ruleL} ${f.rule.ref ?? ''}`.trim() }),
        el('div', { class: 'rule' }, el('div', {}, el('b', { text: T.saysL }), f.rule.says), el('div', {}, el('b', { text: T.doesL }), f.rule.does))) : null,
    ].filter(Boolean);
    if (extras.length) card.append(el('div', { class: 'extras' }, extras));
    card.append(decideBlock(f, card));
    card.append(el('footer', { class: 'meta' }, [T[f.source] ?? f.source, f.category, f.alsoFlaggedBy?.length ? T.alsoFlagged + f.alsoFlaggedBy.join(', ') : null, f.id].filter(Boolean).join(' · ')));
    return card;
  }

  // The decision part of a finding card, rebuilt on its own so a decision never reloads the card's images.
  function decideBlock(f, card) {
    const d = decisions[f.id] ?? {}, cur = statusOf(f);
    const [note, addNote] = noteField('f:' + f.id, 'note-' + f.id, d.note, v => save(f.id, { note: v }));
    const foot = el('div', { class: 'decide-foot' }, el('span', {}),
      el('span', { class: 'foot-actions' }, addNote, cur && canWrite ? el('button', { class: 'link-btn', onclick: () => save(f.id, { status: null }) }, T.clear) : null,
        comments ? el('button', { class: 'link-btn', onclick: () => comments.openComposer({ element: card }).catch(() => {}) }, T.comment) : null));
    const block = el('section', { class: 'decide' },
      f.suggested ? el('div', { class: 'rec-line', style: `--dc:var(--d-${f.suggested})` },
        el('span', { class: 'rec-k', text: T.recHint.replace(/[:\s]+$/, '') }),
        el('span', { class: 'rec-v', text: T[f.suggested] }),
        f.suggestedWhy ? el('span', { class: 'rec-why', text: f.suggestedWhy }) : null) : null,
      el('div', { class: 'seg', role: 'group', 'aria-label': T.status }, STATUSES.map(k => el('button', { id: 's-' + f.id + '-' + k, type: 'button', class: k === f.suggested ? 'sugg' : '', style: `--dc:var(--d-${k})`, 'aria-pressed': String(cur === k), disabled: canWrite ? null : 'disabled', onclick: () => save(f.id, { status: k }) }, T[k]))),
      note, foot);
    whoLine(foot.firstChild, d);
    return block;
  }

  async function whoLine(span, d) {
    if (!d?.at) { span.textContent = ''; return; }
    let name = '';
    try { if (user && d.by) { const ps = await user.profiles([d.by]); name = ps[d.by]?.name || ''; } } catch {}
    span.textContent = `${name || T.someone} · ${new Date(d.at).toLocaleString(locale, { dateStyle: 'short', timeStyle: 'short' })}`;
  }

  async function write(coll, id, cur, patch) {
    if (!db) return;
    const next = { ...cur, ...patch, by: me, at: new Date().toISOString() };
    try { await db.collection(coll).doc(id).set(next); }
    catch (e) { showBanner(e?.code === 'not_granted' ? T.readOnly : T.notSaved); }
  }
  const save = (id, patch) => write('decisions', id, { status: decisions[id]?.status ?? null, note: decisions[id]?.note ?? '' }, patch);
  const saveAnswer = (id, patch) => write('answers', id, { option: answers[id]?.option ?? null, note: answers[id]?.note ?? '' }, patch);

  function showBanner(t) { const b = $('#banner'); b.textContent = t; b.hidden = false; }

  function drift() {
    const rows = D.findings.filter(f => f.rule);
    if (!rows.length) return;
    $('#drift-sec').hidden = false; $('#drift-h').textContent = T.drift;
    const t = $('#drift');
    t.append(el('tr', {}, [T.aspect, T.view, T.says, T.does, T.ref].map(h => el('th', { text: h }))));
    for (const f of [...rows].sort((a, b) => (a.category ?? '').localeCompare(b.category ?? ''))) t.append(el('tr', {}, el('td', { text: f.category ?? '' }), el('td', { class: 'mono', text: viewById(f.view) ? viewTitle(viewById(f.view)) : f.view }), el('td', { text: f.rule.says }), el('td', { text: f.rule.does }), el('td', { class: 'mono', text: f.rule.ref ?? '' })));
  }

  function renderAll() { summary(); questions(); render(); }
  overview(); heat(); controls(); drift(); renderAll();

  // After a decision, update the cards in place. Only filters that hide decided items need a full render.
  function refresh() {
    if (state.open || state.status !== 'all') { keepPlace(renderAll); return; }
    keepPlace(() => {
      summary();
      for (const q of D.questions ?? []) {
        const card = document.getElementById('q-' + q.id); if (!card) continue;
        const cur = optionOf(q);
        card.classList.toggle('answered', !!cur);
        card.querySelectorAll('.opt').forEach((o, i) => {
          const on = cur === q.options[i].key, b = o.querySelector('.pick');
          o.classList.toggle('chosen', on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? T.chosen : T.choose;
        });
        const note = card.querySelector('textarea'); if (note !== document.activeElement) note.value = answers[q.id]?.note ?? '';
        whoLine(card.querySelector('.decide-foot').firstChild, answers[q.id]);
      }
      for (const f of D.findings) {
        const card = document.getElementById('f-' + f.id);
        card?.querySelector('.decide').replaceWith(decideBlock(f, card));
      }
    });
  }

  function listen(coll, store) {
    db.collection(coll).onSnapshot(snap => {
      for (const k of Object.keys(store)) delete store[k];
      for (const doc of snap.docs) if (doc.exists) store[doc.id] = doc.data();
      if (document.activeElement?.tagName === 'TEXTAREA') { pending = true; summary(); return; }
      refresh();
    }, () => showBanner(T.loadFail));
  }

  (async () => {
    const c = window.claude; if (!c?.use) { showBanner(T.offline); return; }
    const [d, u, cm] = await Promise.all([c.use('db'), c.use('user'), c.use('comments')]);
    user = u; comments = cm;
    if (!d) { showBanner(T.signedOut); renderAll(); return; }
    db = d;
    try { me = u ? await u.id() : null; } catch {}
    canWrite = true;
    try { if (u && (await u.can?.('data.write')) === false) canWrite = false; } catch {}
    if (!canWrite) showBanner(T.readOnly);
    renderAll();
    listen('decisions', decisions);
    listen('answers', answers);
  })();
})();
</script>
